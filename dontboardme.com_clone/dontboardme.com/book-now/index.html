d. We prioritize the well-being and happiness of your pets in a familiar environment, so you can travel with confidence, knowing they are receiving the best care and affection right at home.","(Day charge of $25 + $60) 24",90,{"id":17,"createdAt":105,"publishedAt":106,"updatedAt":107,"name":108,"description":109,"hours":110,"price":111},"2023-12-01T11:53:12.381Z","2023-12-01T11:53:13.264Z","2023-12-31T10:47:53.616Z","Half Day Care","Don't Board Me Pet Sitting offers a convenient half-day daily visit service designed to provide your furry family members with the care and attention they deserve right in the comfort of your own home. During this 4-hour block of dedicated pet care, our experienced and compassionate pet sitters will ensure your pets' well-being with a range of personalized services. This includes feeding and replenishing water, engaging in playtime and exercise to keep them active and happy, administering any necessary medications, and maintaining a clean and comfortable living space for your pets. Our in-home visits also include regular updates and affectionate companionship, ensuring that your pets feel secure and cherished until your return. With Don't Board Me Pet Sitting, you can trust that your pets are in loving hands, allowing you to enjoy your day.","4",50,{"id":21,"createdAt":113,"publishedAt":114,"updatedAt":115,"name":116,"description":93,"hours":117,"price":118},"2023-12-31T10:46:59.611Z","2023-12-31T10:47:00.195Z","2023-12-31T10:50:17.028Z","Daily Visit Care (60 min)","1",30,{"pagination":120},{"page":9,"pageCount":9,"pageSize":95,"total":21},{"$sfooter-data-common":3,"$spreloader-state":122,"$snavigation-state":123,"$sanimate-page-while-preloader":122},false,true,{"common-footer":125,"book-now-api":125},null,"/book-now"]</script><script>window.__NUXT__={};window.__NUXT__.config={public:{apiUrl:"https://api.dontboardme.com"},app:{baseURL:"/",buildAssetsDir:"/_nuxt/",cdnURL:""}}</script><script type="module" src="../_nuxt/entry.66570678.js"
